
# PostgreSQL datasource (use environment variables for flexibility)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payments}
spring.datasource.username=${DB_USER:payments_user}
spring.datasource.password=${DB_PASSWORD:pass}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=30000

# Use 'update' for quick dev; switch to 'validate' when using migrations in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

server.port=8080

